<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Theory Tool</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 30px;
        background: #111;
        color: #eee;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .container {
        max-width: 1100px;
        margin: auto;
    }

    h1 {
        text-align: center;
        margin-bottom: 30px;
    }

    .panel {
        background: #1d1d1d;
        border-radius: 12px;
        padding: 24px;
        margin-bottom: 24px;
    }

    h2 {
        margin-top: 0;
    }

    label {
        display: block;
        margin-top: 15px;
        margin-bottom: 6px;
    }

    select,
    input,
    button {
        font: inherit;
    }

    select,
    input {
        width: 100%;
        max-width: 400px;
        padding: 10px;
        border-radius: 6px;
        border: 1px solid #555;
        background: #292929;
        color: white;
    }

    button {
        margin-top: 20px;
        padding: 11px 20px;
        border: none;
        border-radius: 7px;
        background: #eee;
        color: #111;
        cursor: pointer;
        font-weight: bold;
    }

    button:hover {
        background: #ccc;
    }

    .scale {
        font-size: 1.2rem;
        letter-spacing: 4px;
        margin: 15px 0;
    }

    .chord {
        background: #292929;
        border-radius: 10px;
        padding: 18px;
        margin-top: 15px;
    }

    .chord h3 {
        margin-top: 0;
    }

    .degree {
        opacity: 0.7;
        margin-right: 10px;
    }

    .notes {
        margin-bottom: 15px;
    }

    .voicing {
        margin-top: 15px;
        overflow-x: auto;
    }

    pre {
        font-family: "Courier New", monospace;
        line-height: 1.4;
        margin: 0;
    }

    .error {
        background: #5c2020;
        padding: 12px;
        border-radius: 7px;
        margin-top: 15px;
    }

    .quiz-question {
        font-size: 1.2rem;
        margin: 15px 0;
    }

    .score {
        font-weight: bold;
        margin-top: 15px;
    }

.string-row {
    margin-top: 25px;
}

.string-label {
    margin-bottom: 10px;
}

.chord-row {
    display: flex;
    flex-direction: row;
    gap: 15px;
    overflow-x: auto;
    align-items: flex-start;
    padding-bottom: 10px;
}

.chord-row .chord {
    flex: 0 0 180px;
    margin-top: 0;
}

</style>
</head>

<body>

<div class="container">

<h1>🎸 Music Theory Tool</h1>

<div class="panel">

<h2>Diatonic Chord Generator</h2>

<label for="root">Root Note</label>

<select id="root">
    <option>C</option>
    <option>C#</option>
    <option>D</option>
    <option>D#</option>
    <option>E</option>
    <option>F</option>
    <option>F#</option>
    <option>G</option>
    <option>G#</option>
    <option>A</option>
    <option>A#</option>
    <option>B</option>
</select>

<label for="mode">Mode</label>

<select id="mode">
    <option value="ionian">Ionian (Major)</option>
    <option value="dorian">Dorian</option>
    <option value="phrygian">Phrygian</option>
    <option value="lydian">Lydian</option>
    <option value="mixolydian">Mixolydian</option>
    <option value="aeolian">Aeolian (Minor)</option>
    <option value="locrian">Locrian</option>
</select>

<label for="chordLevel">Chord Type</label>

<select id="chordLevel">
    <option value="triads">Triads</option>
    <option value="6ths">6th Chords</option>
    <option value="7ths">7th Chords</option>
    <option value="9ths">9th Chords</option>
    <option value="11ths">11th Chords</option>
    <option value="13ths">13th Chords</option>
</select>

<button onclick="generateDiatonic()">Generate Chords</button>

<div id="diatonicOutput"></div>

</div>

<div class="panel">

<h2>Single Guitar Chord</h2>

<label for="singleChord">Chord</label>

<input
    id="singleChord"
    type="text"
    placeholder="Example: A7, Cmaj7, Em9"
>

<button onclick="generateSingleChord()">Generate Chord</button>

<div id="singleOutput"></div>

</div>

<div class="panel">

<h2>Interval Quiz</h2>

<button onclick="startQuiz()">Start Quiz</button>

<div id="quizOutput"></div>

</div>

</div>

<script>

const NOTES = [
    "C", "C#", "D", "D#", "E", "F",
    "F#", "G", "G#", "A", "A#", "B"
];

const GUITAR_STRINGS = {
    1: "E",
    2: "B",
    3: "G",
    4: "D",
    5: "A",
    6: "E"
};

const ENHARMONIC_EQUIVALENTS = {
    "DB": "C#",
    "EB": "D#",
    "GB": "F#",
    "AB": "G#",
    "BB": "A#",
    "CB": "B",
    "FB": "E",
    "E#": "F",
    "B#": "C"
};

const CHORD_TYPES = {

    major: [0,4,7],
    minor: [0,3,7],
    dim: [0,3,6],
    aug: [0,4,8],

    "6": [0,4,7,9],
    "m6": [0,3,7,9],

    "7": [0,4,7,10],
    "maj7": [0,4,7,11],
    "m7": [0,3,7,10],
    "dim7": [0,3,6,9],
    "m7b5": [0,3,6,10],

    "9": [0,4,7,10,14],
    "maj9": [0,4,7,11,14],
    "m9": [0,3,7,10,14],

    "11": [0,4,7,10,14,17],
    "maj11": [0,4,7,11,14,17],
    "m11": [0,3,7,10,14,17],

    "13": [0,4,7,10,14,21],
    "maj13": [0,4,7,11,14,21],
    "m13": [0,3,7,10,14,21],

    "m7b5add9": [0,3,6,10,14],
    "m7b5add11": [0,3,6,10,17],
    "m7b5add13": [0,3,6,10,21]
};

const MODES = {

    ionian: {
        intervals: [0,2,4,5,7,9,11],
        names: ["I","ii","iii","IV","V","vi","vii°"]
    },

    dorian: {
        intervals: [0,2,3,5,7,9,10],
        names: ["i","ii","♭III","IV","v","vi°","♭VII"]
    },

    phrygian: {
        intervals: [0,1,3,5,7,8,10],
        names: ["i","♭II","♭III","iv","v","♭VI","♭VII"]
    },

    lydian: {
        intervals: [0,2,4,6,7,9,11],
        names: ["I","II","iii","♯iv°","V","vi","vii"]
    },

    mixolydian: {
        intervals: [0,2,4,5,7,9,10],
        names: ["I","ii","iii°","IV","v","vi°","♭VII"]
    },

    aeolian: {
        intervals: [0,2,3,5,7,8,10],
        names: ["i","ii°","♭III","iv","v","♭VI","♭VII"]
    },

    locrian: {
        intervals: [0,1,3,5,6,8,10],
        names: ["i°","♭II","♭III","iv","♭V","♭VI","♭VII"]
    }
};


/* ============================================================
   YOUR PREFERRED 7TH-CHORD VOICINGS
   ============================================================ */

const PREFERRED_VOICINGS = {

    maj7: {

        E: [null,8,9,9,null,8],

        A: [3,5,4,5,3,null],

        D: [12,12,12,10,null,null]
    },

    m7: {

        E: [null,8,8,8,null,8],

        A: [3,4,3,5,3,null],

        D: [11,11,12,10,null,null]
    },

    "7": {

        E: [null,8,9,8,null,8],

        A: [3,5,3,5,3,null],

        D: [12,11,12,10,null,null]
    },

    m7b5: {

        E: [null,7,8,8,null,8],

        A: [null,4,3,4,3,null],

        D: [11,11,11,10,null,null]
    }
};


/* ============================================================
   BASIC NOTE FUNCTIONS
   ============================================================ */

function normalizeNote(note) {

    note = note.trim().toUpperCase();

    if (ENHARMONIC_EQUIVALENTS[note]) {
        return ENHARMONIC_EQUIVALENTS[note];
    }

    return note;
}


function noteNumber(note) {

    return NOTES.indexOf(
        normalizeNote(note)
    );
}


function noteAtFret(openNote, fret) {

    const openNumber =
        noteNumber(openNote);

    return NOTES[
        (openNumber + fret) % 12
    ];
}


function chordNotes(root, intervals) {

    const rootNumber =
        noteNumber(root);

    return [...new Set(
        intervals.map(
            interval =>
                NOTES[
                    (rootNumber + interval) % 12
                ]
        )
    )];
}


/* ============================================================
   SCALE
   ============================================================ */

function scaleNotes(root, mode) {

    const rootNumber =
        noteNumber(root);

    return MODES[mode].intervals.map(
        interval =>
            NOTES[
                (rootNumber + interval) % 12
            ]
    );
}


/* ============================================================
   DIATONIC SEVENTH QUALITY
   ============================================================ */

function diatonicSeventhQuality(scale, degree) {

    const root =
        scale[degree];

    const third =
        scale[(degree + 2) % 7];

    const fifth =
        scale[(degree + 4) % 7];

    const seventh =
        scale[(degree + 6) % 7];

    const rootNumber =
        noteNumber(root);

    const intervals = [
        0,

        (noteNumber(third) - rootNumber + 12) % 12,

        (noteNumber(fifth) - rootNumber + 12) % 12,

        (noteNumber(seventh) - rootNumber + 12) % 12
    ].sort((a,b) => a-b);

    if (
        JSON.stringify(intervals)
        === JSON.stringify([0,3,6,9])
    )
        return "dim7";

    if (
        JSON.stringify(intervals)
        === JSON.stringify([0,3,6,10])
    )
        return "m7b5";

    if (
        JSON.stringify(intervals)
        === JSON.stringify([0,3,7,10])
    )
        return "m7";

    if (
        JSON.stringify(intervals)
        === JSON.stringify([0,4,7,10])
    )
        return "7";

    if (
        JSON.stringify(intervals)
        === JSON.stringify([0,4,7,11])
    )
        return "maj7";

    return "7";
}


/* ============================================================
   DIATONIC EXTENSIONS
   ============================================================ */

function diatonicQualityForDegree(
    scale,
    degree,
    extension
) {

    const root =
        scale[degree];

    const rootNumber =
        noteNumber(root);

    let offsets;

    if (extension === 7)
        offsets = [0,2,4,6];

    else if (extension === 9)
        offsets = [0,2,4,6,8];

    else if (extension === 11)
        offsets = [0,2,4,6,8,10];

    else if (extension === 13)
        offsets = [0,2,4,6,8,10,12];

    else
        offsets = [0,2,4];


    const intervals =
        offsets.map(offset => {

            const note =
                scale[
                    (degree + offset) % 7
                ];

            return (
                noteNumber(note)
                - rootNumber
                + 12
            ) % 12;

        });


    const seventhIntervals =
        intervals.slice(0,4).sort(
            (a,b) => a-b
        );


    if (
        JSON.stringify(seventhIntervals)
        === JSON.stringify([0,3,6,9])
    ) {

        if (extension === 7)
            return "dim7";

    }


    if (
        JSON.stringify(seventhIntervals)
        === JSON.stringify([0,3,6,10])
    ) {

        if (extension === 7)
            return "m7b5";

        if (extension === 9)
            return "m7b5add9";

        if (extension === 11)
            return "m7b5add11";

        if (extension === 13)
            return "m7b5add13";

    }


    const third =
        seventhIntervals[1];

    const seventh =
        seventhIntervals[3];


    let prefix = "";

    if (
        third === 4 &&
        seventh === 11
    )
        prefix = "maj";

    else if (
        third === 3 &&
        seventh === 10
    )
        prefix = "m";


    if (extension === 7) {

        if (prefix === "maj")
            return "maj7";

        if (prefix === "m")
            return "m7";

        return "7";
    }


    if (extension === 9) {

        if (prefix === "maj")
            return "maj9";

        if (prefix === "m")
            return "m9";

        return "9";
    }


    if (extension === 11) {

        if (prefix === "maj")
            return "maj11";

        if (prefix === "m")
            return "m11";

        return "11";
    }


    if (extension === 13) {

        if (prefix === "maj")
            return "maj13";

        if (prefix === "m")
            return "m13";

        return "13";
    }

    return "7";
}


/* ============================================================
   PREFERRED VOICING TRANSPOSE
   ============================================================ */

function transposeShapeFromC(
    shape,
    rootString,
    root
) {

    const rootIndex = {

        E: 5,

        A: 4,

        D: 3

    }[rootString];


    if (
        rootIndex === undefined ||
        shape[rootIndex] === null
    )
        return null;


    let shift =
        noteNumber(root)
        - noteNumber("C");


    if (shift > 6)
        shift -= 12;

    if (shift < -6)
        shift += 12;


    return shape.map(
        fret =>
            fret === null
            ? null
            : fret + shift
    );
}


function preferredShapeFor(
    root,
    quality,
    rootString
) {

    const template =
        PREFERRED_VOICINGS[
            quality
        ]?.[rootString];


    if (!template)
        return null;


    const shape =
        transposeShapeFromC(
            template,
            rootString,
            root
        );


    if (!shape)
        return null;


    if (
        shape.some(
            fret =>
                fret !== null &&
                (fret < 0 || fret > 15)
        )
    )
        return null;


    return shape;
}


/* ============================================================
   GENERIC GUITAR SHAPE GENERATOR
   ============================================================ */

function possibleFretsForString(
    openNote,
    chordNotes
) {

    const frets = [];

    for (
        let fret = 0;
        fret <= 15;
        fret++
    ) {

        const note =
            noteAtFret(
                openNote,
                fret
            );

        if (
            chordNotes.includes(note)
        )
            frets.push(fret);

    }

    return frets;
}


function playedNotesForShape(shape) {

    const notes = [];

    shape.forEach(
        (fret,index) => {

            if (fret === null)
                return;

            notes.push(
                noteAtFret(
                    GUITAR_STRINGS[
                        index + 1
                    ],
                    fret
                )
            );

        }
    );

    return [...new Set(notes)];
}


function fretSpan(shape) {

    const played =
        shape.filter(
            fret =>
                fret !== null
        );

    if (!played.length)
        return 0;

    return (
        Math.max(...played)
        -
        Math.min(...played)
    );
}


function estimatedFingers(shape) {

    const fretted =
        shape.filter(
            fret =>
                fret !== null &&
                fret > 0
        );

    return new Set(fretted).size;
}


function physicallyReasonable(shape) {

    if (
        shape.filter(
            fret => fret !== null
        ).length < 3
    )
        return false;


    if (
        fretSpan(shape) > 3
    )
        return false;


    if (
        estimatedFingers(shape) > 4
    )
        return false;


    return true;
}


function generateShapes(chordNotes) {

    const possible = {};

    for (
        let stringNumber = 1;
        stringNumber <= 6;
        stringNumber++
    ) {

        possible[stringNumber] =
            possibleFretsForString(
                GUITAR_STRINGS[stringNumber],
                chordNotes
            );

    }


    const shapes = [];


    function build(
        stringNumber,
        current
    ) {

        if (
            stringNumber === 7
        ) {

            if (
                physicallyReasonable(
                    current
                )
            )
                shapes.push(
                    [...current]
                );

            return;
        }


        current.push(null);

        build(
            stringNumber + 1,
            current
        );

        current.pop();


        for (
            const fret of
            possible[stringNumber]
        ) {

            current.push(fret);

            build(
                stringNumber + 1,
                current
            );

            current.pop();

        }

    }


    build(1, []);

    return shapes;
}


/* ============================================================
   ROOT-STRING FILTER
   ============================================================ */

function shapeHasRootOnString(
    shape,
    root,
    rootString
) {

    const stringIndex = {

        E: 5,

        A: 4,

        D: 3

    }[rootString];


    if (
        stringIndex === undefined
    )
        return false;


    const fret =
        shape[stringIndex];


    if (fret === null)
        return false;


    const note =
        noteAtFret(
            GUITAR_STRINGS[
                stringIndex + 1
            ],
            fret
        );


    if (note !== root)
        return false;


    /*
       Force all lower strings to be muted.

       E root:
       nothing below it.

       A root:
       low E muted.

       D root:
       low E and A muted.
    */

    if (rootString === "A") {

        if (shape[5] !== null)
            return false;

    }


    if (rootString === "D") {

        if (shape[5] !== null)
            return false;

        if (shape[4] !== null)
            return false;

    }


    return true;
}


/* ============================================================
   BEST GENERIC SHAPE FOR A ROOT STRING
   ============================================================ */

function findBestShapeForRootString(
    root,
    chordNotes,
    rootString
) {

    const shapes =
        generateShapes(
            chordNotes
        );


    const matching =
        shapes.filter(
            shape =>
                shapeHasRootOnString(
                    shape,
                    root,
                    rootString
                )
        );


    if (!matching.length)
        return null;


    let best = null;
    let bestScore = -Infinity;


    matching.forEach(shape => {

        const notes =
            playedNotesForShape(
                shape
            );


        let score = 0;


        score +=
            notes.length * 20;


        score -=
            shape.filter(
                fret => fret === null
            ).length * 10;


        score -=
            fretSpan(shape) * 10;


        score -=
            estimatedFingers(shape) * 8;


        const rootStringIndex = {

            E: 5,

            A: 4,

            D: 3

        }[rootString];


        if (
            rootStringIndex !== undefined &&
            shape[rootStringIndex] !== null
        )
            score += 100;


        /*
           Prefer the root in the bass.

           Because lower strings are already
           muted where appropriate, the selected
           root string becomes the lowest played
           string.
        */

        if (
            rootString === "E" &&
            shape[5] !== null
        )
            score += 100;


        if (
            rootString === "A" &&
            shape[4] !== null &&
            shape[5] === null
        )
            score += 100;


        if (
            rootString === "D" &&
            shape[3] !== null &&
            shape[4] === null &&
            shape[5] === null
        )
            score += 100;


        if (
            score > bestScore
        ) {

            bestScore = score;

            best = shape;

        }

    });


    return best;
}


/* ============================================================
   EXTENDED CHORD SHAPE
   ============================================================ */

function findBestExtendedShapeForRootString(
    root,
    chordNotes,
    quality,
    rootString
) {

    const shape =
        findBestShapeForRootString(
            root,
            chordNotes,
            rootString
        );


    if (shape)
        return shape;


    return null;
}


/* ============================================================
   BUILD DIATONIC CHORDS
   ============================================================ */

function buildDiatonicChords(
    root,
    mode,
    chordLevel
) {

    const scale =
        scaleNotes(
            root,
            mode
        );


    const modeData =
        MODES[mode];


    const chords = [];


    for (
        let degree = 0;
        degree < 7;
        degree++
    ) {

        const chordRoot =
            scale[degree];


        let quality;


        if (
            chordLevel === "triads"
        ) {

            const third =
                scale[
                    (degree + 2) % 7
                ];

            const fifth =
                scale[
                    (degree + 4) % 7
                ];


            const rootNumber =
                noteNumber(
                    chordRoot
                );


            const thirdInterval =
                (
                    noteNumber(third)
                    -
                    rootNumber
                    +
                    12
                ) % 12;


            const fifthInterval =
                (
                    noteNumber(fifth)
                    -
                    rootNumber
                    +
                    12
                ) % 12;


            if (
                thirdInterval === 4 &&
                fifthInterval === 7
            )
                quality = "major";

            else if (
                thirdInterval === 3 &&
                fifthInterval === 7
            )
                quality = "minor";

            else if (
                thirdInterval === 3 &&
                fifthInterval === 6
            )
                quality = "dim";

            else if (
                thirdInterval === 4 &&
                fifthInterval === 8
            )
                quality = "aug";

            else
                quality = "major";

        }

        else if (
            chordLevel === "7ths"
        ) {

            quality =
                diatonicSeventhQuality(
                    scale,
                    degree
                );

        }

        else if (
            chordLevel === "9ths"
        ) {

            quality =
                diatonicQualityForDegree(
                    scale,
                    degree,
                    9
                );

        }

        else if (
            chordLevel === "11ths"
        ) {

            quality =
                diatonicQualityForDegree(
                    scale,
                    degree,
                    11
                );

        }

        else if (
            chordLevel === "13ths"
        ) {

            quality =
                diatonicQualityForDegree(
                    scale,
                    degree,
                    13
                );

        }

        else if (
            chordLevel === "6ths"
        ) {

            const third =
                scale[
                    (degree + 2) % 7
                ];

            const fifth =
                scale[
                    (degree + 4) % 7
                ];


            const rootNumber =
                noteNumber(
                    chordRoot
                );


            const thirdInterval =
                (
                    noteNumber(third)
                    -
                    rootNumber
                    +
                    12
                ) % 12;


            const fifthInterval =
                (
                    noteNumber(fifth)
                    -
                    rootNumber
                    +
                    12
                ) % 12;


            quality =
                (
                    thirdInterval === 3 &&
                    fifthInterval === 7
                )
                ? "m6"
                : "6";
        }


        let notes;


        if (
            chordLevel === "6ths"
        ) {

            notes = [

                chordRoot,

                scale[
                    (degree + 2) % 7
                ],

                scale[
                    (degree + 4) % 7
                ],

                scale[
                    (degree + 5) % 7
                ]

            ];

        }

        else {

            notes =
                chordNotes(
                    chordRoot,
                    CHORD_TYPES[
                        quality
                    ]
                );

        }


        const voicings = {};


        /*
           IMPORTANT:

           Generate THREE independent suggestions.

           E root
           A root + low E muted
           D root + low E and A muted
        */

        ["E","A","D"].forEach(
            rootString => {

                let shape =
                    preferredShapeFor(
                        chordRoot,
                        quality,
                        rootString
                    );


                if (!shape) {

                    shape =
                        findBestShapeForRootString(
                            chordRoot,
                            notes,
                            rootString
                        );

                }


                voicings[rootString] =
                    shape;

            }
        );


        let displayQuality =
            quality === "major"
            ? ""
            : quality;


        chords.push({

            degree:
                modeData.names[degree],

            name:
                chordRoot +
                displayQuality,

            root:
                chordRoot,

            quality:
                quality,

            notes:
                notes,

            voicings:
                voicings

        });

    }


    return chords;
}


/* ============================================================
   TAB
   ============================================================ */

function formatFret(fret) {

    if (
        fret === null ||
        fret === undefined
    )
        return "x";

    return String(fret);

}


function renderVoicing(
    voicing
) {

    if (!voicing)
        return "No practical voicing found.";


    const strings = [
        ["e",0],
        ["B",1],
        ["G",2],
        ["D",3],
        ["A",4],
        ["E",5]
    ];


    let output = "";


    strings.forEach(
        ([name,index]) => {

            output +=
                name +
                "|" +
                formatFret(
                    voicing[index]
                ) +
                "\n";

        }
    );


    return output;
}


/* ============================================================
   DIATONIC DISPLAY
   ============================================================ */

function generateDiatonic() {

    const root =
        document.getElementById(
            "root"
        ).value;

    const mode =
        document.getElementById(
            "mode"
        ).value;

    const chordLevel =
        document.getElementById(
            "chordLevel"
        ).value;

    const scale =
        scaleNotes(
            root,
            mode
        );

    const chords =
        buildDiatonicChords(
            root,
            mode,
            chordLevel
        );

    let html = "";

    html +=
        "<h2>Scale</h2>";

    html +=
        `<div class="scale">
            ${scale.join("  ")}
        </div>`;

    html +=
        "<h2>Diatonic Chords</h2>";

    ["E", "A", "D"].forEach(
        rootString => {

            html +=
                `<div class="string-row">`;

            html +=
                `<h3 class="string-label">
                    Root on ${rootString} string
                </h3>`;

            html +=
                `<div class="chord-row">`;

            chords.forEach(
                chord => {

                    html +=
                        `<div class="chord">`;

                    html +=
                        `<h3>
                            <span class="degree">
                                ${chord.degree}
                            </span>
                            ${chord.name}
                        </h3>`;

                    html +=
                        `<div class="notes">
                            ${chord.notes.join(" ")}
                        </div>`;

                    html +=
                        `<pre>${renderVoicing(
                            chord.voicings[rootString]
                        )}</pre>`;

                    html +=
                        `</div>`;

                }
            );

            html +=
                `</div>`;

            html +=
                `</div>`;

        }
    );

    document.getElementById(
        "diatonicOutput"
    ).innerHTML = html;
}


/* ============================================================
   SINGLE CHORD PARSER
   ============================================================ */

function parseChordName(input) {

    let chord =
        input.trim().toLowerCase();

    chord =
        chord
        .replaceAll(
            "major seventh",
            "maj7"
        )
        .replaceAll(
            "major 7th",
            "maj7"
        )
        .replaceAll(
            "major 7",
            "maj7"
        );

    chord =
        chord
        .replaceAll(
            "minor seventh",
            "m7"
        )
        .replaceAll(
            "minor 7th",
            "m7"
        )
        .replaceAll(
            "minor 7",
            "m7"
        );

    chord =
        chord
        .replaceAll(
            "dominant seventh",
            "7"
        )
        .replaceAll(
            "dominant 7th",
            "7"
        )
        .replaceAll(
            "dominant 7",
            "7"
        );

    chord =
        chord
        .replaceAll(
            "major ninth",
            "maj9"
        )
        .replaceAll(
            "major 9th",
            "maj9"
        )
        .replaceAll(
            "major 9",
            "maj9"
        );

    chord =
        chord
        .replaceAll(
            "minor ninth",
            "m9"
        )
        .replaceAll(
            "minor 9th",
            "m9"
        )
        .replaceAll(
            "minor 9",
            "m9"
        );

    chord =
        chord
        .replaceAll(
            "major sixth",
            "6"
        )
        .replaceAll(
            "major 6th",
            "6"
        );

    chord =
        chord
        .replaceAll(
            "minor sixth",
            "m6"
        )
        .replaceAll(
            "minor 6th",
            "m6"
        );

    chord =
        chord
        .replaceAll(
            "diminished seventh",
            "dim7"
        )
        .replaceAll(
            "diminished 7th",
            "dim7"
        );

    chord =
        chord.replaceAll(
            " ",
            ""
        );

    let root;
    let quality;

    if (
        chord.length >= 2 &&
        (
            chord[1] === "#" ||
            chord[1] === "b"
        )
    ) {

        root =
            chord.substring(0,2);

        quality =
            chord.substring(2);

    }

    else {

        root =
            chord.substring(0,1);

        quality =
            chord.substring(1);

    }

    root =
        normalizeNote(root);

    if (
        !NOTES.includes(root)
    )
        return null;

    /*
       Basic triad aliases:

       A       -> major
       Amaj    -> major
       Am      -> minor
       Amin    -> minor
       A minor -> minor
    */

    if (!quality)
        quality = "major";

    else if (
        quality === "maj"
    )
        quality = "major";

    else if (
        quality === "m" ||
        quality === "min" ||
        quality === "minor"
    )
        quality = "minor";

    quality =
        quality
        .replaceAll(
            "th",
            ""
        );

    if (
        !CHORD_TYPES[quality]
    )
        return null;

    return {

        root: root,

        quality: quality,

        intervals:
            CHORD_TYPES[quality]

    };

}


function generateSingleChord() {

    const input =
        document.getElementById(
            "singleChord"
        ).value;


    const chord =
        parseChordName(
            input
        );


    const output =
        document.getElementById(
            "singleOutput"
        );


    if (!chord) {

        output.innerHTML =
            `<div class="error">
                Sorry, I don't recognize that chord.
            </div>`;

        return;
    }


    const notes =
        chordNotes(
            chord.root,
            chord.intervals
        );


    let html =
        `<div class="chord">
            <h3>
                ${chord.root}${chord.quality === "major" ? "" : chord.quality}
            </h3>

            <div class="notes">
                Chord tones:
                ${notes.join(" ")}
            </div>`;


    ["E","A","D"].forEach(
        rootString => {

            const shape =
                preferredShapeFor(
                    chord.root,
                    chord.quality,
                    rootString
                )
                ||
                findBestShapeForRootString(
                    chord.root,
                    notes,
                    rootString
                );


            html +=
                `<div class="voicing">

                    <strong>
                        Root on ${rootString} string
                    </strong>

                    <pre>
${renderVoicing(shape)}
                    </pre>

                </div>`;

        }
    );


    html +=
        `</div>`;


    output.innerHTML =
        html;
}


/* ============================================================
   INTERVAL QUIZ
   ============================================================ */

let quizScore = 0;
let quizQuestion = 0;
let currentInterval = null;

const QUIZ_LENGTH = 5;

function intervalName(interval) {

    const names = {

        0: "unison or octave",

        1: "minor 2nd",

        2: "major 2nd",

        3: "minor 3rd",

        4: "major 3rd",

        5: "perfect 4th",

        6: "tritone",

        7: "perfect 5th",

        8: "minor 6th",

        9: "major 6th",

        10: "minor 7th",

        11: "major 7th"

    };

    return names[interval];
}

function startQuiz() {

    quizScore = 0;
    quizQuestion = 0;

    nextQuizQuestion();
}

function nextQuizQuestion() {

    quizQuestion++;

    const note1 =
        NOTES[
            Math.floor(
                Math.random() *
                NOTES.length
            )
        ];

    const note2 =
        NOTES[
            Math.floor(
                Math.random() *
                NOTES.length
            )
        ];

    let interval =
        noteNumber(note2)
        -
        noteNumber(note1);

    if (interval < 0)
        interval += 12;

    currentInterval = interval;

    document.getElementById(
        "quizOutput"
    ).innerHTML = `

        <div class="quiz-question">

            <div class="quiz-progress">
                Question ${quizQuestion} of ${QUIZ_LENGTH}
            </div>

            <br>

            Root note:
            <strong>${note1}</strong>

            <br><br>

            Second note:
            <strong>${note2}</strong>

        </div>

        <br>

        <input
            id="quizAnswer"
            type="text"
            placeholder="e.g. major 3rd"
        >

        <br><br>

        <button onclick="checkQuiz()">
            Submit Answer
        </button>

        <div id="quizResult"></div>

    `;

    document.getElementById(
        "quizAnswer"
    ).focus();
}

function checkQuiz() {

    const answer =
        document.getElementById(
            "quizAnswer"
        ).value
        .trim()
        .toLowerCase();

    const correct =
        intervalName(
            currentInterval
        );

    const result =
        document.getElementById(
            "quizResult"
        );

    const acceptableAnswers =

        currentInterval === 0

        ? [
            "unison",
            "octave",
            "unison or octave"
          ]

        : [
            correct.toLowerCase()
          ];

    if (
        acceptableAnswers.includes(answer)
    ) {

        quizScore++;

        result.innerHTML =
            `<p>
                <strong>✓ Correct!</strong>
            </p>`;

    }

    else {

        result.innerHTML =
            `<p>
                <strong>✗ Incorrect.</strong>
                The correct answer was:
                <strong>${correct}</strong>
            </p>`;

    }

    result.innerHTML +=
        `<div class="score">
            Score: ${quizScore}/${quizQuestion}
        </div>`;

    if (quizQuestion < QUIZ_LENGTH) {

        result.innerHTML +=
            `<br>
            <button onclick="nextQuizQuestion()">
                Next Question →
            </button>`;

    }

    else {

        const percentage =
            Math.round(
                (quizScore / QUIZ_LENGTH) * 100
            );

        result.innerHTML += `

            <div class="quiz-complete">

                <h3>🏆 Quiz Complete!</h3>

                <p>
                    Final Score:
                    <strong>
                        ${quizScore}/${QUIZ_LENGTH}
                    </strong>
                </p>

                <p>
                    ${percentage}%
                </p>

                <button onclick="startQuiz()">
                    Play Again
                </button>

            </div>

        `;

    }
}
